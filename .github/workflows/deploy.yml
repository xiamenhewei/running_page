# 跑步主页构建发布：直接用仓库里的 src/static/activities.json（数据管线在本地跑好入库）
# 为什么不在 Actions 重跑 gpx_sync：1035 条 GPX 解析+时区计算在 Actions 单机上超 45 分钟，得不偿失
name: Deploy Running Page

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
